name: Codex issue implementation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue-number:
        description: Open GitHub issue number to implement.
        required: true
        type: number

permissions: {}

jobs:
  draft:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'codex: ready' }}"
    # Replace the zero SHA with a reviewed full commit SHA from stuttter/.github.
    uses: stuttter/.github/.github/workflows/codex-issue.yml@0000000000000000000000000000000000000000
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      issue-number: ${{ github.event.issue.number || inputs.issue-number }}
      base-branch: master
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FLEET_SIGNING_KEY: ${{ secrets.FLEET_SIGNING_KEY }}
      FLEET_SIGNING_PUBLIC_KEY: ${{ secrets.FLEET_SIGNING_PUBLIC_KEY }}
      FLEET_SIGNING_EMAIL: ${{ secrets.FLEET_SIGNING_EMAIL }}
