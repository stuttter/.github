name: WordPress plugin CI

on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON array of PHP versions to syntax-check.
        required: false
        type: string
        default: '["7.2", "7.4", "8.0", "8.2", "8.4"]'
      quality-php-version:
        description: PHP version used for Composer-backed quality checks.
        required: false
        type: string
        default: '8.4'
      build-artifact:
        description: Build and upload a production ZIP.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      project-check-matrix: ${{ steps.project-policy.outputs.matrix }}
      plugin_check: ${{ steps.integration-policy.outputs.plugin_check }}
      integration_matrix: ${{ steps.integration-policy.outputs.matrix }}
    steps:
      - name: Validate immutable policy reference
        env:
          POLICY_REF: ${{ job.workflow_sha }}
        shell: bash
        run: '[[ "${POLICY_REF}" =~ ^[0-9a-f]{40}$ ]]'

      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out portfolio standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stuttter/.github
          ref: ${{ job.workflow_sha }}
          path: .portfolio-standard
          persist-credentials: false

      - name: Validate plugin metadata
        run: php .portfolio-standard/scripts/validate-plugin.php .

      - name: Resolve trusted project checks
        id: project-policy
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node .portfolio-standard/scripts/project-check-policy.mjs --repository "${TARGET_REPOSITORY}" --project-root . >> "${GITHUB_OUTPUT}"

      - name: Resolve trusted integration policy
        id: integration-policy
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node .portfolio-standard/scripts/integration-check-policy.mjs --repository "${TARGET_REPOSITORY}" --project-root . >> "${GITHUB_OUTPUT}"

  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Check PHP syntax
        shell: bash
        run: git ls-files -z -- '*.php' | xargs -0 -n1 php -l

  quality:
    name: Project quality suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pull request base reference
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: '[[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]'

      - name: Fetch pull request base commit
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: git fetch --no-tags --depth=1 origin "${BASE_SHA}"

      - name: Check out portfolio standard
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stuttter/.github
          ref: ${{ job.workflow_sha }}
          path: .portfolio-standard
          persist-credentials: false

      - name: Reject static-analysis baseline growth
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .portfolio-standard/scripts/check-static-analysis-baselines.mjs "${BASE_SHA}"

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.quality-php-version }}
          coverage: none
          tools: composer

      - name: Validate Composer configuration
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer validate --strict

      - name: Install locked development tools
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        if: ${{ hashFiles('composer.lock') != '' }}
        run: composer audit --locked

      - name: Run project checks
        if: ${{ hashFiles('composer.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail

          for script in phpcs phpstan; do
            # The PHP program is intentionally single-quoted for the shell.
            # shellcheck disable=SC2016
            if php -r '$config = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); exit(isset($config["scripts"][$argv[1]]) ? 0 : 1);' "${script}"; then
              composer --no-interaction run-script "${script}"
            fi
          done

  project-checks:
    name: ${{ matrix.name }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.project-check-matrix) }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out portfolio standard for project checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stuttter/.github
          ref: ${{ job.workflow_sha }}
          path: .portfolio-standard
          persist-credentials: false

      - name: Set up minimum PHP
        if: ${{ matrix.kind == 'minimum-php' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Run PHPUnit on minimum PHP
        if: ${{ matrix.kind == 'minimum-php' }}
        env:
          PHPUNIT_CONFIG: ${{ matrix.config }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          test "${PHPUNIT_CONFIG}" = 'phpunit.xml.dist'
          node .portfolio-standard/scripts/project-check-policy.mjs --repository "${TARGET_REPOSITORY}" --project-root . --mode verify
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
          node .portfolio-standard/scripts/project-check-policy.mjs --repository "${TARGET_REPOSITORY}" --project-root . --mode verify-installed
          junit_result="${RUNNER_TEMP}/phpunit-junit.xml"
          set +e
          vendor/bin/phpunit --configuration "${PHPUNIT_CONFIG}" --log-junit "${junit_result}"
          phpunit_status=$?
          set -e
          php .portfolio-standard/scripts/validate-phpunit-junit.php "${junit_result}"
          test "${phpunit_status}" -eq 0

      - name: Set up approved Node.js
        if: ${{ matrix.kind == 'node-assets' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Verify deterministic generated assets
        if: ${{ matrix.kind == 'node-assets' }}
        env:
          NODE_BUILD_SCRIPT: ${{ matrix.script }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "${NODE_BUILD_SCRIPT}" = 'build:check'
          node .portfolio-standard/scripts/project-check-policy.mjs --repository "${TARGET_REPOSITORY}" --project-root . --mode verify
          npm ci --ignore-scripts
          node .portfolio-standard/scripts/project-check-policy.mjs --repository "${TARGET_REPOSITORY}" --project-root . --mode verify
          npm run-script "${NODE_BUILD_SCRIPT}"

      - name: Run isolated live smoke check
        if: ${{ matrix.kind == 'live-smoke' }}
        env:
          SMOKE_SCRIPT: ${{ matrix.script }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SMOKE_SCRIPT}" =~ ^(bin|tests)/[A-Za-z0-9._/-]+\.sh$ ]]
          [[ "${SMOKE_SCRIPT}" != *$'\r'* ]]
          [[ "${SMOKE_SCRIPT}" != *$'\n'* ]]
          [[ "${SMOKE_SCRIPT}" != *'//'* ]]
          [[ "${SMOKE_SCRIPT}" != *'/../'* ]]
          test -f "${SMOKE_SCRIPT}"
          test ! -L "${SMOKE_SCRIPT}"
          resolved_script="$(realpath "${SMOKE_SCRIPT}")"
          [[ "${resolved_script}" == "${GITHUB_WORKSPACE}/"* ]]
          node .portfolio-standard/scripts/project-check-policy.mjs --repository "${TARGET_REPOSITORY}" --project-root . --mode verify
          bash -- "${SMOKE_SCRIPT}"

      - name: Confirm no project-specific checks are enrolled
        if: ${{ matrix.kind == 'none' }}
        run: echo 'No additional project-specific checks are enrolled.'

  plugin-check:
    name: WordPress Plugin Check
    needs: metadata
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report undeclared Plugin Check
        if: ${{ needs.metadata.outputs.plugin_check != 'true' }}
        run: echo 'WordPress Plugin Check is not enabled for this pilot profile.'

      - name: Check out plugin
        if: ${{ needs.metadata.outputs.plugin_check == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject repository-controlled wp-env configuration
        if: ${{ needs.metadata.outputs.plugin_check == 'true' }}
        shell: bash
        run: |
          for path in .wp-env.json .wp-env.override.json; do
            if [[ -e "${path}" || -L "${path}" ]]; then
              echo "Plugin Check requires centrally generated wp-env configuration; remove ${path}." >&2
              exit 1
            fi
          done

      - name: Check out portfolio standard
        if: ${{ needs.metadata.outputs.plugin_check == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stuttter/.github
          ref: ${{ job.workflow_sha }}
          path: .portfolio-standard
          persist-credentials: false

      - name: Set up PHP
        if: ${{ needs.metadata.outputs.plugin_check == 'true' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Build plugin for Plugin Check
        if: ${{ needs.metadata.outputs.plugin_check == 'true' }}
        id: plugin-check-build
        shell: bash
        run: |
          plugin_directory="$(bash .portfolio-standard/scripts/prepare-plugin-build.sh . "${RUNNER_TEMP}/plugin-check-build")"
          echo "plugin_directory=${plugin_directory}" >> "${GITHUB_OUTPUT}"

      - name: Run WordPress Plugin Check
        if: ${{ needs.metadata.outputs.plugin_check == 'true' }}
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ steps.plugin-check-build.outputs.plugin_directory }}
          include-experimental: 'false'
          repo-token: ''

  wordpress-integration:
    name: ${{ matrix.name }}
    needs: metadata
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.integration_matrix) }}
    steps:
      - name: Report undeclared WordPress integration
        if: ${{ matrix.target == 'disabled' }}
        run: echo 'A real WordPress integration profile is not declared for this repository.'

      - name: Check out plugin
        if: ${{ matrix.target != 'disabled' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out portfolio standard
        if: ${{ matrix.target != 'disabled' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stuttter/.github
          ref: ${{ job.workflow_sha }}
          path: .portfolio-standard
          persist-credentials: false

      - name: Verify the centrally approved smoke payload
        if: ${{ matrix.target != 'disabled' }}
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        run: node .portfolio-standard/scripts/integration-check-policy.mjs --repository "${TARGET_REPOSITORY}" --project-root .

      - name: Set up PHP for the deterministic build
        if: ${{ matrix.target != 'disabled' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Set up the locked WordPress runtime
        if: ${{ matrix.target != 'disabled' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .portfolio-standard/runtime/wordpress/package-lock.json

      - name: Install the locked WordPress runtime
        if: ${{ matrix.target != 'disabled' }}
        working-directory: .portfolio-standard/runtime/wordpress
        run: npm ci --ignore-scripts

      - name: Apply audited WordPress 5.0 runtime compatibility
        if: ${{ matrix.target != 'disabled' }}
        run: >-
          node .portfolio-standard/scripts/patch-wordpress-env.mjs
          .portfolio-standard/runtime/wordpress/node_modules/@wordpress/env/lib/runtime/docker/wordpress.js

      - name: Build plugin for WordPress integration
        if: ${{ matrix.target != 'disabled' }}
        id: integration-build
        shell: bash
        run: |
          plugin_directory="$(bash .portfolio-standard/scripts/prepare-plugin-build.sh . "${RUNNER_TEMP}/integration-build")"
          echo "plugin_directory=${plugin_directory}" >> "${GITHUB_OUTPUT}"

      - name: Generate isolated WordPress configuration
        if: ${{ matrix.target != 'disabled' }}
        id: integration-config
        env:
          INTEGRATION_PHP: ${{ matrix.php }}
          INTEGRATION_TARGET: ${{ matrix.target }}
          INTEGRATION_TOPOLOGY: ${{ matrix.topology }}
          INTEGRATION_WORDPRESS: ${{ matrix.wordpress }}
          PLUGIN_DIRECTORY: ${{ steps.integration-build.outputs.plugin_directory }}
        shell: bash
        run: |
          config="${RUNNER_TEMP}/wp-env-integration.json"
          slug="$(node .portfolio-standard/scripts/configure-wordpress-integration.mjs \
            --repository-root . \
            --plugin-directory "${PLUGIN_DIRECTORY}" \
            --output "${config}" \
            --target "${INTEGRATION_TARGET}" \
            --wordpress "${INTEGRATION_WORDPRESS}" \
            --php "${INTEGRATION_PHP}" \
            --topology "${INTEGRATION_TOPOLOGY}")"
          echo "config=${config}" >> "${GITHUB_OUTPUT}"
          echo "slug=${slug}" >> "${GITHUB_OUTPUT}"

      - name: Run repository smoke test in real WordPress
        if: ${{ matrix.target != 'disabled' }}
        env:
          WP_ENV_HOME: ${{ runner.temp }}/wp-env-${{ matrix.target }}
        run: >-
          bash .portfolio-standard/scripts/run-wordpress-integration.sh
          .portfolio-standard/runtime/wordpress/node_modules/.bin/wp-env
          "${{ steps.integration-config.outputs.config }}"
          "${{ steps.integration-config.outputs.slug }}"
          "${{ matrix.topology }}"

  artifact:
    name: Production artifact
    if: ${{ inputs.build-artifact }}
    needs: [metadata, syntax, quality, project-checks, plugin-check, wordpress-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable policy reference
        env:
          POLICY_REF: ${{ job.workflow_sha }}
        shell: bash
        run: '[[ "${POLICY_REF}" =~ ^[0-9a-f]{40}$ ]]'

      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out portfolio standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stuttter/.github
          ref: ${{ job.workflow_sha }}
          path: .portfolio-standard
          persist-credentials: false

      - name: Build production ZIP
        run: bash .portfolio-standard/scripts/build-plugin.sh . build

      - name: Upload production ZIP and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-production-artifact
          path: |
            build/*.zip
            build/*.sha256
          if-no-files-found: error
          retention-days: 14
