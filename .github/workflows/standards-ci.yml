name: Standards CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate shared standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked visual tooling
        run: npm ci

      - name: Check scripts
        run: |
          php -l scripts/validate-plugin.php
          bash -n scripts/build-plugin.sh
          bash -n brand/export.sh
          bash -n brand/validate.sh

      - name: Check JSON
        run: |
          php -r 'json_decode(file_get_contents("schema/plugin-standard.schema.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("examples/plugin-standard.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("brand/tokens.json"), true, 512, JSON_THROW_ON_ERROR);'
          php -r 'json_decode(file_get_contents("brand/plugins.json"), true, 512, JSON_THROW_ON_ERROR);'

      - name: Validate deterministic visual exports
        run: |
          # shellcheck disable=SC2016
          find brand/sources -type f -name '*.svg' -print0 | xargs -0 -n1 php -r '$document = new DOMDocument(); exit($document->load($argv[1]) ? 0 : 1);'
          bash brand/export.sh
          bash brand/validate.sh

      - name: Check workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml", "examples/*.yml"].each { |file| YAML.parse_file(file); puts "YAML OK: #{file}" }'

      - name: Validate GitHub Actions semantics
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz' \
            --output "${archive}"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  ${archive}" | shasum -a 256 --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
          "${RUNNER_TEMP}/actionlint" -color examples/*.yml

      - name: Reject mutable third-party Actions
        shell: bash
        run: |
          if grep -R --line-number --extended-regexp 'uses: [^#[:space:]]+@(main|master|v[0-9]+([[:space:]]|$))' .github/workflows examples | grep -v 'uses: stuttter/.github/'; then
            echo 'Third-party Actions must use full commit SHAs.' >&2
            exit 1
          fi
